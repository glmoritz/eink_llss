# LLSS production deployment on the server (router-linux-host).
#   Deploy: git pull && docker compose -f deploy/compose.yml up -d --build
#
# Sits on the internal_containers macvlan at the address traefik already routes to
# (172.30.0.46, inherited from the retired eink-proxy), serving HTTP on :80 so the
# existing traefik->172.30.0.46:80 firewall path is unchanged. Inherits the eink
# router labels (Host(eink.tutu.eng.br), TLS termination at traefik with the
# embedded-debug TLS options the ESP32 needs). DB + HLSS are reached internally.
name: eink-llss
services:
  llss:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # This host's docker has no default `bridge` network, so build RUN steps
      # must use host networking to get internet (apt/pip).
      network: host
    image: eink-llss:debug
    container_name: eink-llss
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - PORT=80
    networks:
      internal_containers:
        ipv4_address: 172.30.0.46
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=internal_containers"
      - "traefik.http.routers.eink.entrypoints=websecure"
      - "traefik.http.routers.eink.rule=Host(`eink.tutu.eng.br`)"
      - "traefik.http.routers.eink.tls=true"
      - "traefik.http.routers.eink.tls.options=embedded-debug@file"
      - "traefik.http.services.eink.loadbalancer.server.port=80"
      # BasicAuth on the admin/debug surface only (single user moritz). The
      # eink-admin router carries a higher priority + the auth middleware for
      # these paths; the catch-all eink router above still serves the device
      # (token-authed) for everything else. bcrypt hash, $ escaped as $$.
      - "traefik.http.middlewares.eink-auth.basicauth.users=moritz:$$2b$$05$$ncwVwePW0ykR4ewkwwJppuf34Yf01V97F656oqHcaGxy7WGtNq8GG"
      - "traefik.http.routers.eink-admin.rule=Host(`eink.tutu.eng.br`) && (PathPrefix(`/api/admin`) || PathPrefix(`/api/debug`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || Path(`/openapi.json`))"
      - "traefik.http.routers.eink-admin.entrypoints=websecure"
      - "traefik.http.routers.eink-admin.tls=true"
      - "traefik.http.routers.eink-admin.tls.options=embedded-debug@file"
      - "traefik.http.routers.eink-admin.priority=100"
      - "traefik.http.routers.eink-admin.service=eink"
      - "traefik.http.routers.eink-admin.middlewares=eink-auth"

networks:
  internal_containers:
    external: true
